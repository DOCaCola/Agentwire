# Merge with: docker compose -f compose.yaml -f deploy/compose.caddy.yaml up -d --build
# Set the external network name to your existing Caddy network. The loopback-only base port remains
# available for local diagnostics; containers communicate over caddy_default.
services:
  agentwire:
    networks:
      default: {}
      caddy:
        aliases: [agentwire]

networks:
  caddy:
    external: true
    name: caddy_default
